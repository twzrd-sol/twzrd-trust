name: agent-killswitch image to GHCR

# workflow_dispatch only: no push, tag or pull_request trigger, so nothing an
# outside branch or PR does can push an image. A person starts each run and
# names the version and commit it must match.
#
# Auth is the image job's GITHUB_TOKEN with packages: write. No personal token
# is stored or widened. The test suite runs first, in the conformance job,
# which has contents: read only: two of its tests execute the sibling gate and
# the gate's dependencies, and those must not run in the job that can push.
# This repository is public, but do not assume the GHCR package's visibility:
# check it in the package settings after the first push.
# Runs only from main; the version and commit checks below bind what is built.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "agent-killswitch/package.json version this run must match, e.g. 0.1.2"
        required: true
      expected_commit:
        description: "Full 40-character commit SHA this run must be building"
        required: true

permissions:
  contents: read

concurrency:
  group: agent-killswitch-image
  cancel-in-progress: false

jobs:
  conformance:
    uses: ./.github/workflows/agent-killswitch-conformance.yml
    permissions:
      contents: read

  image:
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: agent-killswitch
    env:
      IMAGE: ghcr.io/twzrd-sol/agent-killswitch
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse unless version and commit match the request
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::runs from main only, got $GITHUB_REF. Refusing."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected_version '$EXPECTED_VERSION' is not MAJOR.MINOR.PATCH. Refusing."
            exit 1
          fi
          if [ ${#EXPECTED_COMMIT} -ne 40 ]; then
            echo "::error::expected_commit ('$EXPECTED_COMMIT' is $((${#EXPECTED_COMMIT})) chars) must be exactly 40 hex chars. Refusing."
            exit 1
          fi
          actual_version=$(node -p "require('./package.json').version")
          actual_commit=$(git rev-parse HEAD)
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::package.json is $actual_version, the request named $EXPECTED_VERSION. Refusing."
            exit 1
          fi
          if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::checked out $actual_commit, the request named $EXPECTED_COMMIT. Refusing."
            exit 1
          fi
          echo "version $actual_version at $actual_commit"

      # Node here only serves `npm view` below. Nothing is installed or tested
      # on this runner: the tests ran in the conformance job, and the Docker
      # build does its own `npm ci` and tsc build inside the image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Refuse to overwrite an existing version tag
        # Only a registry answer of "manifest unknown" counts as "tag absent".
        # "unauthorized" or "denied" means this token cannot see the package,
        # so the tag may exist; fail closed instead of building over it. The
        # old check treated any failed inspect as "absent".
        run: |
          if out=$(docker manifest inspect "$IMAGE:$EXPECTED_VERSION" 2>&1); then
            echo "::error::$IMAGE:$EXPECTED_VERSION already exists. Bump the version instead of overwriting it."
            exit 1
          fi
          case "$out" in
            *"manifest unknown"*|*"no such manifest"*)
              echo "$IMAGE:$EXPECTED_VERSION is not published yet" ;;
            *)
              echo "::error::Cannot tell whether $IMAGE:$EXPECTED_VERSION exists (registry said: ${out:0:200}). Check the package's Actions access before re-running."
              exit 1 ;;
          esac

      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${EXPECTED_COMMIT}" \
            --label "org.opencontainers.image.version=${EXPECTED_VERSION}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.title=agent-killswitch" \
            -t "$IMAGE:$EXPECTED_VERSION" \
            .

      - name: Move latest only when this is npm's latest
        # Building an older version later must not move :latest backwards.
        # Publish to npm first; an unreadable dist-tag leaves :latest alone.
        run: |
          npm_latest=$(npm view @twzrd1111/agent-killswitch dist-tags.latest 2>/dev/null || true)
          if [ "$npm_latest" = "$EXPECTED_VERSION" ]; then
            docker tag "$IMAGE:$EXPECTED_VERSION" "$IMAGE:latest"
            echo "MOVE_LATEST=1" >> "$GITHUB_ENV"
          else
            echo "npm latest is '${npm_latest}', not $EXPECTED_VERSION: leaving :latest where it is"
          fi

      - name: Push and record the digest
        run: |
          docker push "$IMAGE:$EXPECTED_VERSION"
          if [ "${MOVE_LATEST:-}" = "1" ]; then docker push "$IMAGE:latest"; fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$EXPECTED_VERSION")
          {
            echo "### agent-killswitch $EXPECTED_VERSION"
            echo ""
            echo "- commit: \`$EXPECTED_COMMIT\`"
            echo "- image: \`$digest\`"
            if [ "${MOVE_LATEST:-}" = "1" ]; then echo "- tags: $EXPECTED_VERSION, latest"; else echo "- tags: $EXPECTED_VERSION"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pushed $digest"

      - name: Log out
        if: always()
        run: docker logout ghcr.io
