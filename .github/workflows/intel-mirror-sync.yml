# Opens a draft PR when the public mirror (server/llms.txt, server/.well-known/mcp.json) differs from live intel.
# It never merges. Merging still goes through the trust procedure (local-ci/gate on the head, then merge-gated with a GO line).
# A red `verify` on a sync PR whose live gate_npm is ahead of twzrd-x402-gate/package.json means the gate lane must bump
# package.json first (current-pin.test.ts). The sync PR is not the fix.
# GITHUB_TOKEN-opened PRs do not trigger pull_request workflows, so `verify` does not start on these PRs by itself.
# Workflows may create PRs in this repo (repository setting enabled 2026-10-26). If the PR step fails anyway, the branch is still pushed and the run is red.
name: Intel mirror sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: intel-mirror-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: automation/intel-mirror-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Compare mirror with live intel (fails closed on fetch errors)
        id: check
        run: |
          set +e
          node scripts/sync-intel-mirror.mjs --check
          rc=$?
          set -e
          case "$rc" in
            0) echo "in_sync=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "in_sync=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::live intel fetch or parse failed (exit $rc); no PR"; exit "$rc" ;;
          esac
      - name: Write mirror and push the bot branch
        if: steps.check.outputs.in_sync == 'false'
        run: |
          set -euo pipefail
          node scripts/sync-intel-mirror.mjs
          git config user.name TWZRD
          git config user.email 33047129+twzrd-sol@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add server/llms.txt server/.well-known/mcp.json
          git commit -q -F - <<'EOF'
          docs: re-sync server mirror to live intel

          Automated by the intel-mirror-sync workflow. The mirror omits mcp.json's build block.

          Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>
          EOF
          git push --force origin "$BRANCH"
      - name: Open a draft PR (or leave the open one updated)
        if: steps.check.outputs.in_sync == 'false'
        run: |
          set -uo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing is open on $BRANCH and now carries the new commit."
            exit 0
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated re-sync of `server/llms.txt` and `server/.well-known/mcp.json` to live `intel.twzrd.xyz`.

          - Generated by `scripts/sync-intel-mirror.mjs`. The `build` block (sha and image digest) is omitted; it changes every deploy.
          - Opened as a draft. Merge only through the trust procedure: `local-ci/gate` on the head, then `merge-gated` with a GO line that names this PR and the full head SHA.
          - `verify` does not start automatically on a GITHUB_TOKEN-opened PR. Start it by closing and reopening the PR, or by running `npm ci && npm run ci` under `gate-run` and posting `local-ci/gate` by hand.
          - A red `verify` whose live `gate_npm` is ahead of `twzrd-x402-gate/package.json` means the gate lane must bump `package.json` first. This PR is not the fix.
          - Permission note: this workflow requests `contents: write` and `pull-requests: write`. The existing gate-release-drift workflow is `contents: read`.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" \
              --title "docs: re-sync server mirror to live intel (automated)" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::gh pr create failed. The branch $BRANCH is pushed. Operator: allow workflows to create PRs, or run gh pr create --draft --head $BRANCH by hand."
            exit 1
          fi
