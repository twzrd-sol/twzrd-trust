name: Publish @twzrd1111/mandate to npm

# workflow_dispatch ONLY, like publish.yml: a publish token must never be
# reachable from an untrusted PR. A human presses the button and types the
# version and the commit they expect to ship.
#
# First publish: @twzrd1111/mandate has never been on npm. The first run uses
# secrets.NPM_TOKEN, and that token must be allowed to create a new package in
# the @twzrd1111 scope (a granular token limited to selected packages cannot).
# If it is not, the run fails at `npm publish`, after every check, and nothing
# is published. Afterwards this workflow can be added as the package's trusted
# publisher on npmjs.com, and the OIDC path below takes over when NPM_TOKEN is
# empty.
#
# Permissions: contents: read (nothing is tagged or pushed);
# id-token: write (npm provenance and OIDC).
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'twzrd-mandate/package.json version this run must match (refuses on any other)'
        required: true
      expected_commit:
        description: 'Full 40-character commit SHA on main this run must be at (refuses on any other)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Main only, enforced by GitHub: the Npm_token environment's deployment
    # policy allows refs/heads/main and nothing else, so a run dispatched on
    # any other branch never starts and never sees NPM_TOKEN or an OIDC token.
    # The job reads the NPM_TOKEN stored in this environment. A repository-
    # level NPM_TOKEN is readable from any branch, so none should exist.
    # Guarded by scripts/publish-workflows-ref-guard.test.mjs.
    environment: Npm_token
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: twzrd-mandate
    env:
      PACKAGE: '@twzrd1111/mandate'
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unless dispatched from main
        # Second line of defence if the environment policy is ever loosened.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publishes from main only, got $GITHUB_REF -- refusing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Decide publish auth
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using secrets.NPM_TOKEN"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.NPM_TOKEN is empty; will publish via npm Trusted Publishing (OIDC)."
            echo "That only works after the first publish, once this workflow"
            echo "(twzrd-sol/twzrd-trust / .github/workflows/publish-mandate.yml)"
            echo "is added as a trusted publisher on npmjs.com for @twzrd1111/mandate."
          fi

      - name: Refuse unless name, version and commit match the request
        run: |
          if ! printf '%s' "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected_version '$EXPECTED_VERSION' is not MAJOR.MINOR.PATCH -- refusing."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_commit is not a full 40-character SHA -- refusing."
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          ACTUAL=$(node -p "require('./package.json').version")
          COMMIT=$(git rev-parse HEAD)
          if [ "$NAME" != "$PACKAGE" ]; then
            echo "::error::package.json names $NAME, not $PACKAGE -- refusing."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_VERSION" ]; then
            echo "::error::package.json is $ACTUAL, you confirmed $EXPECTED_VERSION -- refusing to publish."
            exit 1
          fi
          if [ "$COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::checked out $COMMIT, you confirmed $EXPECTED_COMMIT -- refusing."
            exit 1
          fi
          echo "Confirmed: publishing $NAME@$ACTUAL at $COMMIT"

      - name: Refuse unless the CHANGELOG dates this version
        run: |
          HEADING=$(awk -v h="## $EXPECTED_VERSION" '$0 == h || index($0, h " ") == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error::CHANGELOG.md has no '## $EXPECTED_VERSION' entry -- refusing."
            exit 1
          fi
          if ! printf '%s' "$HEADING" | grep -Eq "^## [0-9.]+ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"; then
            echo "::error::CHANGELOG.md says '$HEADING', not '## $EXPECTED_VERSION (YYYY-MM-DD)' -- date it before publishing."
            exit 1
          fi
          echo "CHANGELOG: $HEADING"

      - name: Refuse a version the registry already has
        run: |
          LIVE="$(npm view "${PACKAGE}@${EXPECTED_VERSION}" version 2>/dev/null || true)"
          if [ -n "$LIVE" ]; then
            echo "::error::$PACKAGE@$LIVE is already on npm -- bump the version instead."
            exit 1
          fi

      - name: Install dependencies (lockfile)
        run: npm ci
        working-directory: .

      - name: Build the sibling packages the mandate compiles against
        # The gate and the log verifier are workspace links here; their dist/ must exist.
        run: npm run build && npm run build --workspace=twzrd-log-verifier
        working-directory: .

      - name: Typecheck, build and test
        run: npm run typecheck && npm test

      - name: pack-smoke (tarball contents, clean install from npm, CLI, breaker proof)
        run: npm run pack-smoke

      - name: Publish with token
        if: steps.auth.outputs.mode == 'token'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with OIDC trusted publishing
        if: steps.auth.outputs.mode == 'oidc'
        run: |
          # Trusted publishing needs npm 11.5.1+. Node 20 ships npm 10.
          npm install -g npm@11
          npm --version
          # setup-node writes _authToken=${NODE_AUTH_TOKEN}; an empty expansion
          # makes npm skip OIDC and die ENEEDAUTH (publish.yml, run 34089898111).
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            echo "Stripping _authToken from $NPMRC_PATH"
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          if [ -f "$HOME/.npmrc" ] && [ "$HOME/.npmrc" != "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          npm publish --access public --provenance

      - name: Verify against the live registry
        run: bash ../scripts/verify-live-npm-version.sh "$PACKAGE" "$EXPECTED_VERSION"
