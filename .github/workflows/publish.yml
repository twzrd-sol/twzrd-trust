name: Publish twzrd-x402-gate to npm

# Deliberately workflow_dispatch ONLY -- no push/tag/release trigger.
# This package's publish token has real authority over a package with real
# users; a workflow reachable by an untrusted PR (e.g. via `pull_request`)
# is the standard way CI publish tokens get exfiltrated. Manual button-press
# only, by a human who can see exactly what version is about to ship.
#
# Auth (either works):
# - secrets.NPM_TOKEN: classic granular publish token
# - npm Trusted Publishing (OIDC): id-token: write is already granted. If
#   NODE_AUTH_TOKEN is empty, setup-node's registry-url writes
#   `_authToken=${NODE_AUTH_TOKEN}` which expands to empty and npm then
#   skips OIDC and dies ENEEDAUTH (run 34089898111). We strip that line
#   and publish with npm 11+ --provenance on the OIDC path.
#
# Permissions:
# - contents: write (for creating tags / releases)
# - id-token: write (for npm provenance / OIDC minting)
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'package.json version this run must match (safety check -- prevents publishing the wrong commit by accident)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Main only, enforced by GitHub: the Npm_token environment's deployment
    # policy allows refs/heads/main and nothing else, so a run dispatched on
    # any other branch never starts and never sees NPM_TOKEN or an OIDC token.
    # The job reads the NPM_TOKEN stored in this environment. A repository-
    # level NPM_TOKEN is readable from any branch, so none should exist.
    # Guarded by scripts/publish-workflows-ref-guard.test.mjs.
    environment: Npm_token
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: twzrd-x402-gate
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unless dispatched from main
        # Second line of defence if the environment policy is ever loosened.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publishes from main only, got $GITHUB_REF -- refusing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Decide publish auth
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using secrets.NPM_TOKEN"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.NPM_TOKEN is empty; will publish via npm Trusted Publishing (OIDC)."
            echo "If publish later fails auth, either set repo secret NPM_TOKEN or add this workflow"
            echo "(twzrd-sol/twzrd-trust / .github/workflows/publish.yml) as a trusted publisher"
            echo "on npmjs.com for twzrd-x402-gate."
          fi

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Verify version matches the operator's confirmation
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "${{ inputs.expected_version }}" ]; then
            echo "::error::package.json is $ACTUAL, you confirmed ${{ inputs.expected_version }} -- refusing to publish. Re-run with the correct version, or fix the checked-out ref."
            exit 1
          fi
          echo "Confirmed: publishing $ACTUAL"

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: pack-smoke (real tarball install + consumer check)
        run: npm run pack-smoke

      - name: Refuse an incomplete public tarball
        run: npm run pack-release-contract

      - name: Publish with token
        if: steps.auth.outputs.mode == 'token'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with OIDC trusted publishing
        if: steps.auth.outputs.mode == 'oidc'
        run: |
          # Trusted publishing needs npm 11.5.1+. Node 20 ships npm 10.
          npm install -g npm@11
          npm --version
          # setup-node writes _authToken=${NODE_AUTH_TOKEN} to the *active*
          # userconfig (NPM_CONFIG_USERCONFIG, often $RUNNER_TEMP/.npmrc).
          # An empty expansion makes npm skip OIDC and die ENEEDAUTH.
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            echo "Stripping _authToken from $NPMRC_PATH"
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          if [ -f "$HOME/.npmrc" ] && [ "$HOME/.npmrc" != "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          npm publish --access public --provenance

      - name: Verify against the live registry
        # Run 41740588074: publish of 0.16.1 succeeded at 23:38:20Z (npm:
        # "may take a few minutes to become available"). The inline 18×10s
        # poll ended 23:41:25Z; the registry recorded 0.16.1 at 23:41:29Z.
        # Shared poller: ~10 min deadline, backoff, cache clear, npm view
        # plus registry tarball/dist-tags. Does not publish.
        working-directory: .
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: bash scripts/verify-live-npm-version.sh twzrd-x402-gate "$EXPECTED_VERSION"
