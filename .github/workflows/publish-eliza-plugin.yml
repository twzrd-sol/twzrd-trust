name: Publish @wzrd_sol/eliza-plugin to npm

# Not pull_request-triggered -- that is how CI publish tokens get exfiltrated.
# Operator button only: workflow_dispatch on main. The eliza-plugin-v* tag
# trigger and the source_ref input were removed (2026-11-11): a tag push or
# a source_ref let a run publish a commit that never landed on main.
#
# Auth (either works):
# - secrets.NPM_TOKEN
# - npm Trusted Publishing (OIDC): add this workflow as a trusted publisher
#   on npmjs.com for @wzrd_sol/eliza-plugin
#
# After a successful publish, resync the public mirror with:
#   node scripts/resync-eliza-plugin.mjs --version <published>
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'eliza-plugin-source package.json version this run must match'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Main only, enforced by GitHub: the Npm_token environment's deployment
    # policy allows refs/heads/main and nothing else, so a run dispatched on
    # any other branch never starts and never sees NPM_TOKEN or an OIDC token.
    # The job reads the NPM_TOKEN stored in this environment. A repository-
    # level NPM_TOKEN is readable from any branch, so none should exist.
    # Guarded by scripts/publish-workflows-ref-guard.test.mjs.
    environment: Npm_token
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unless dispatched from main
        # Second line of defence if the environment policy is ever loosened.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publishes from main only, got $GITHUB_REF -- refusing."
            exit 1
          fi

      - name: Resolve expected version
        id: ver
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          echo "expected=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing expected version $EXPECTED_VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Decide publish auth
        id: auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using secrets.NPM_TOKEN"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.NPM_TOKEN is empty; will publish via npm Trusted Publishing (OIDC)."
            echo "If publish later fails auth, either set repo secret NPM_TOKEN or add this workflow"
            echo "(twzrd-sol/twzrd-trust / .github/workflows/publish-eliza-plugin.yml) as a trusted publisher"
            echo "on npmjs.com for @wzrd_sol/eliza-plugin."
          fi

      - name: Install dependencies
        run: npm install

      - name: Build twzrd-x402-gate
        run: npm run build --workspace=twzrd-x402-gate

      - name: Verify source version matches the operator's confirmation
        run: |
          ACTUAL=$(node -p "require('./eliza-plugin-source/package.json').version")
          EXPECTED="${{ steps.ver.outputs.expected }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::eliza-plugin-source is $ACTUAL, you confirmed $EXPECTED -- refusing to publish."
            exit 1
          fi
          echo "Confirmed: publishing @wzrd_sol/eliza-plugin@$ACTUAL"

      - name: Typecheck source
        run: npm run typecheck --workspace=@wzrd_sol/eliza-plugin-source

      - name: Test source
        run: npm test --workspace=@wzrd_sol/eliza-plugin-source

      - name: Pack public tarball
        run: node scripts/pack-eliza-plugin.mjs

      - name: Refuse an incomplete public tarball
        run: node scripts/assert-eliza-publish-pack.mjs --from-staging .npm/eliza-plugin-publish/staging --from-tarball "$(node -p "require('./.npm/eliza-plugin-publish/manifest.json').tarball")"

      - name: Publish with token
        if: steps.auth.outputs.mode == 'token'
        working-directory: .npm/eliza-plugin-publish/staging
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with OIDC trusted publishing
        if: steps.auth.outputs.mode == 'oidc'
        working-directory: .npm/eliza-plugin-publish/staging
        run: |
          npm install -g npm@11
          npm --version
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            echo "Stripping _authToken from $NPMRC_PATH"
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          if [ -f "$HOME/.npmrc" ] && [ "$HOME/.npmrc" != "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi
          npm publish --access public --provenance

      - name: Verify against the live registry
        # Run 39886755826: 18×10s ended 2026-10-23T01:59:31Z; npm recorded
        # 0.8.1 at 2026-10-23T02:00:32Z. The shared poller's ~10 min backoff
        # window covers that lag. It does not publish.
        run: bash scripts/verify-live-npm-version.sh @wzrd_sol/eliza-plugin "${{ steps.ver.outputs.expected }}"
